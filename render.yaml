# Deploiement de la PLATEFORME sur Render.com (Blueprint).
# Render lit ce fichier et configure tout seul le service web.
# Guide pas a pas : DEPLOIEMENT_RENDER.md
services:
  - type: web
    name: plateforme-arbitrage
    runtime: python
    plan: free            # gratuit pour tester (voir les limites dans le guide)
    buildCommand: "pip install -r requirements.txt && pip install -r server/requirements.txt"
    startCommand: "uvicorn server.app:get_app --factory --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # La cle maitre de chiffrement : NON commitee. Tu la colles dans le
      # tableau de bord Render (sync:false => Render la demande). Genere-la avec :
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: BOT_PLATFORM_SECRET
        sync: false
      - key: PLATFORM_DB_PATH
        value: "platform.db"

    # --- Garder les comptes apres un redemarrage (offre payante) --------------
    # Sur l'offre gratuite, la base est effacee a chaque redemarrage (test only).
    # Pour la rendre permanente : passe en offre payante, DECOMMENTE le bloc
    # ci-dessous, et change PLATFORM_DB_PATH ci-dessus en "/var/data/platform.db".
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
